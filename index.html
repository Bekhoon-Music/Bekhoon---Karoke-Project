<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEKHOON BK001</title>
<style>
body{margin:0;background:#09070e;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:20px;box-sizing:border-box}
header{display:flex;justify-content:space-between;color:#ff55d9;font-weight:800;font-size:22px}
.cover{width:170px;height:170px;margin:32px auto 18px;border-radius:28px;display:grid;place-items:center;font-size:70px;background:linear-gradient(135deg,#ff3cac,#7548ff,#19d3ff)}
h1,p{text-align:center}h1{margin:0 0 5px}p{opacity:.6}
#lyrics{height:120px;overflow:auto;text-align:center;margin:18px 0}
.line{opacity:.3;font-size:20px;padding:8px}.active{opacity:1;font-size:27px;font-weight:800;color:#ff77dc}
input{width:100%;accent-color:#ff4fd8}.times{display:flex;justify-content:space-between;direction:ltr;opacity:.6}
.controls{display:flex;justify-content:center;gap:20px;margin:0px 16px 16px}button{border:0;border-radius:50%;width:55px;height:55px;background:#292332;color:white;font-size:20px}
#play{width:96px;height:96px;min-width:96px;flex-shrink:0;padding:0;background:linear-gradient(135deg,#ff3cac,#a855f7,#3b82f6);color:white;border:3px solid #ffffff;box-shadow:0 0 18px #a855f7;border-radius:50%;transform:translateY(-12px);}
audio{width:100%;margin-top:15px}
</style>
<main class="app"><header><span>‹</span><span>BEKHOON</span><span>♡</span></header>
<div class="cover">🎤</div><h1>امشب بخون</h1><p>BEKHOON ORIGINAL</p>
<div id="lyrics"></div><input id="seek" type="range" min="0" max="47" value="0" step=".01">
<div class="times"><span id="now">00:00</span><span>00:47</span></div>
<div class="controls"><button onclick="skip(-5)">↶</button>
<button id="play" onclick="toggle()" style="position:relative;display:flex;align-items:center;justify-content:center;touch-action:manipulation">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="position:absolute;inset:0;overflow:visible">
<text x="50" y="18" fill="white" font-size="18" font-weight="bold" text-anchor="middle">بخون</text>
<path d="M 39 34 L 39 62 L 65 48 Z" fill="white"/>
<text x="50" y="83" fill="white" font-size="13" font-weight="bold" letter-spacing="1" text-anchor="middle">BEKHOON</text>
</svg></button>
<button onclick="skip(5)">↷</button></div>
<audio id="audio" preload="metadata" style="display:none" src="audio/BK001.mp3"></audio>
<script>
const L=[{"start": 4, "end": 8, "text": "امشب چراغا روشنه"}, {"start": 8, "end": 12, "text": "دل من از غصه دوره"}, {"start": 12, "end": 16, "text": "بذار صداتو بشنوم"}, {"start": 16, "end": 21, "text": "این شب برای ماست، دوباره"}, {"start": 21, "end": 25, "text": "دستاتو بالا ببر"}, {"start": 25, "end": 29, "text": "با ریتم این آهنگ بخون"}, {"start": 29, "end": 33, "text": "هرچی که توی قلبته"}, {"start": 33, "end": 38, "text": "امشب فقط برای من بخون"}, {"start": 38, "end": 41, "text": "🎤 امشب بخون"}, {"start": 41, "end": 44, "text": "بلندتر از همیشه"}, {"start": 44, "end": 47, "text": "اینجا صدای تو، قشنگ‌ترین صدا میشه"}],a=document.getElementById('audio'),p=document.getElementById('play'),s=document.getElementById('seek'),n=document.getElementById('now'),box=document.getElementById('lyrics');
L.forEach((x,i)=>{let d=document.createElement('div');d.className='line';d.id='l'+i;d.textContent=x.text;box.appendChild(d)});
function fmt(v){v=Math.floor(v||0);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
let clickTimer = null;

function toggle(){
  if(clickTimer){
    clearTimeout(clickTimer);
    clickTimer = null;
    a.currentTime = 0;
    a.play().catch(()=>{});
  } else {
    clickTimer = setTimeout(()=>{
      clickTimer = null;

      if(a.paused){
        a.play().catch(()=>{});
      } else {
        a.pause();
      }
    }, 300);
  }
}
let userScrollUntil = 0;
let lastActiveIndex = -1;

['wheel', 'touchstart', 'pointerdown', 'keydown'].forEach(eventName => {
  box.addEventListener(eventName, () => {
    userScrollUntil = Date.now() + 5000;
  });
});

a.ontimeupdate = () => {
  s.value = a.currentTime;
  n.textContent = fmt(a.currentTime);

  let i = L.findLastIndex(x => a.currentTime >= x.start);

  document.querySelectorAll('.line').forEach((e, j) => {
    e.classList.toggle('active', j === i);
  });

  if (i >= 0 && i !== lastActiveIndex && Date.now() > userScrollUntil) {
    const activeLine = document.getElementById('l' + i);
    const boxRect = box.getBoundingClientRect();
    const lineRect = activeLine.getBoundingClientRect();

    const newPosition =
      box.scrollTop +
      lineRect.top -
      boxRect.top -
      (box.clientHeight - lineRect.height) / 2;

    box.scrollTo({ top: newPosition, behavior: 'smooth' });
  }

  lastActiveIndex = i;
};
function skip(v){a.currentTime=Math.max(0,Math.min(a.duration||47,a.currentTime+v))}
</script>

<div id="recorder" style="margin-top:16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap">
  <div style="width:100%;text-align:center;margin-bottom:16px;direction:rtl">
  <label style="margin:10px">
    <input type="radio" name="recordingMode" value="audio" checked>
    فقط صدا
  </label>

  <label style="margin:10px">
    <input type="radio" name="recordingMode" value="video">
    فیلم با صدا
  </label>
</div>
  <button id="recordBtn" onclick="startRecording()" style="background-color:#1976d2;color:white;border:none;border-radius:8px;padding:12px 24px;min-width:190px;display:inline-flex;align-items:center;justify-content:center;min-height:48px;box-sizing:border-box;;font-size:16px;white-space:nowrap;direction:rtl;text-align:center;cursor:pointer">
    شروع ضبط صدا

  </button>
  <button id="stopBtn" onclick="stopRecording()" disabled style="background-color:#d32f2f;color:white;border:none;border-radius:8px;padding:12px 24px;min-width:190px;display:inline-flex;align-items:center;justify-content:center;min-height:48px;box-sizing:border-box;font-size:16px;white-space:nowrap;direction:rtl;text-align:center;cursor:pointer">
    توقف ضبط
 </button>
<audio id="myRecording" style="display:none"></audio>
  <video id="cameraPreview"
  autoplay muted playsinline
style="display:none;width:320px;max-width:100%;height:auto;border-radius:14px;margin:12px auto">
</video>

<video id="videoRecording"
  controls playsinline
  style="display:none;width:100%;max-width:500px;margin:12px auto;border-radius:14px">
</video>
  <div id="customPlayer" style="display:none;width:100%;margin-top:12px;padding:12px;background:linear-gradient(135deg,#b2f5ea,#d6f0ff);border-radius:16px;box-sizing:border-box;align-items:center;justify-content:center;gap:12px">
  <button id="playRecordingBtn" type="button" onclick="toggleRecordingPlayback()" style="background:#7c4dff;color:white;border:0;border-radius:50%;width:48px;height:48px;font-size:20px">▶</button>
  <span id="recordingTime" style="font-size:15px;color:#333">00:00</span>
  <button type="button" onclick="hideRecording()" style="background:#ff4081;color:white;border:0;border-radius:50%;width:42px;height:42px;font-size:24px">×</button>
</div>
<a id="downloadRecording" href="#" download
style="display:none;margin-top:10px;background-color:#2e7d32;color:white;padding:12px 20px;border-radius:8px;text-decoration:none">
ضبط صدات
</a>
  <style>
#downloadRecording {
  position: relative;
  display: none;
}
#downloadRecording::before,
#downloadRecording::after {
  display: inline-block;
  font-size: 22px;
  animation: musicSparkle 1.2s infinite alternate;
}

#downloadRecording::before {
  content: "✨🎵 ";
}

#downloadRecording::after {
  content: " 🎶✨";
}

@keyframes musicSparkle {
  from { transform: scale(1); opacity: 0.65; }
  to { transform: scale(1.2); opacity: 1; }
}
</style>
<script>
let recorder;
let recordedChunks = [];
  let recordingMode = 'audio';
function hideRecording() {
  const audio = document.getElementById('myRecording');
  audio.pause();
  audio.removeAttribute('src');
  audio.load();

  document.getElementById('customPlayer').style.display = 'none';
  document.getElementById('playRecordingBtn').textContent = '▶';
  document.getElementById('recordingTime').textContent = '00:00';
  }
async function startRecording() {
  const previousAudio = document.getElementById('myRecording');
  const cameraPreview = document.getElementById('cameraPreview');
  const videoPlayer = document.getElementById('videoRecording');
  const customPlayer = document.getElementById('customPlayer');
  const downloadLink = document.getElementById('downloadRecording');

  previousAudio.pause();
  previousAudio.removeAttribute('src');
  previousAudio.load();

  videoPlayer.pause();
  videoPlayer.removeAttribute('src');
  videoPlayer.load();

  customPlayer.style.display = 'none';
  videoPlayer.style.display = 'none';
  cameraPreview.style.display = 'none';
  cameraPreview.srcObject = null;
  downloadLink.style.display = 'none';

  document.getElementById('playRecordingBtn').textContent = '▶';
  document.getElementById('recordingTime').textContent = '00:00';

  const selectedMode =
    document.querySelector('input[name="recordingMode"]:checked')?.value || 'audio';

  recordingMode = selectedMode;

  try {
    const stream = await navigator.mediaDevices.getUserMedia(
      selectedMode === 'video'
        ? { audio: true, video: true }
        : { audio: true }
    );

    recordedChunks = [];

    if (selectedMode === 'video') {
      cameraPreview.srcObject = stream;
      cameraPreview.style.display = 'block';
      cameraPreview.play().catch(() => {});
    }

    recorder = new MediaRecorder(stream);

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        recordedChunks.push(event.data);
      }
    };

    recorder.onstop = () => {
      const mimeType = recorder.mimeType || 'video/webm';
      const blob = new Blob(recordedChunks, { type: mimeType });

      if (blob.size > 0) {
        const recordingUrl = URL.createObjectURL(blob);

        downloadLink.href = recordingUrl;
        downloadLink.download =
          'Bekhoon-Recording-001.' +
          (mimeType.includes('mp4') ? 'mp4' : 'webm');
        downloadLink.style.display = 'inline-block';

        if (recordingMode === 'video') {
          videoPlayer.src = recordingUrl;
          videoPlayer.style.display = 'block';
          videoPlayer.load();
        } else {
          previousAudio.src = recordingUrl;
          previousAudio.controls = false;
          previousAudio.load();
          customPlayer.style.display = 'flex';
        }
      } else {
        alert('صدایی ضبط نشد. دوباره امتحان کن.');
      }

      cameraPreview.pause();
      cameraPreview.srcObject = null;
      cameraPreview.style.display = 'none';

      stream.getTracks().forEach(track => track.stop());
    };

    recorder.start();

    document.getElementById('recordBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;

    const status = document.getElementById('status');
    if (status) {
      status.textContent = '🔴 ضبط در حال انجام است';
    }

  } catch (error) {
    alert('برای ضبط، اجازه دسترسی به میکروفن و دوربین را بده.');
    cameraPreview.srcObject = null;
    cameraPreview.style.display = 'none';
  }
}
  function toggleRecordingPlayback() {
  const audio = document.getElementById('myRecording');
  const button = document.getElementById('playRecordingBtn');

  if (audio.paused) {
    audio.play();
    button.textContent = '❚❚';
  } else {
    audio.pause();
    button.textContent = '▶';
  }
}
  function updateRecordingTime() {
  const audio = document.getElementById('myRecording');
  const time = document.getElementById('recordingTime');

  const minutes = Math.floor(audio.currentTime / 60);
  const seconds = Math.floor(audio.currentTime % 60);

  time.textContent =
    String(minutes).padStart(2, '0') + ':' +
    String(seconds).padStart(2, '0');
}

document.getElementById('myRecording').addEventListener('timeupdate', updateRecordingTime);

document.getElementById('myRecording').addEventListener('ended', () => {
  document.getElementById('playRecordingBtn').textContent = '▶';
});
function stopRecording() {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    document.getElementById('recordBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    const status = document.getElementById('status');
 if (status) status.textContent = 'ضبط تمام شد؛ صدایت را پخش کن.';
  }
}
</script>    
</html>
